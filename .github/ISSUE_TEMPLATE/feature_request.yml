name: Feature request
description: Suggest a public game tool or addon improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: input
    id: project
    attributes:
      label: Project or game
      placeholder: "Armory Buddy / World of Warcraft"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Player problem
      description: What would this help players or mod authors accomplish?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed experience
      description: Describe the simplest useful approach and any relevant platform limitations.
    validations:
      required: false
