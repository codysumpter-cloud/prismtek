.c29{animation-delay:1.885s}
.c30{animation-delay:1.950s}
.c31{animation-delay:2.015s}
.c32{animation-delay:2.080s}
.c33{animation-delay:2.145s}
.c34{animation-delay:2.210s}
.c35{animation-delay:2.275s}
.c36{animation-delay:2.340s}
.c37{animation-delay:2.405s}
.c38{animation-delay:2.470s}
.c39{animation-delay:2.535s}
.c40{animation-delay:2.600s}
.c41{animation-delay:2.665s}
.c42{animation-delay:2.730s}
.c43{animation-delay:2.795s}
.c44{animation-delay:2.860s}
.c45{animation-delay:2.925s}
.c46{animation-delay:2.990s}
  .echo{fill:#b15fe4;opacity:0;animation:afterimage 10.4s steps(1,end) infinite}
  @keyframes signal{
    0%,3%,14%,100%{fill:#165a72;opacity:1}
    5%,7%{fill:#00b9a8;opacity:1}
    9%{fill:#7e43d3;opacity:1}
    11%{fill:#3597c4;opacity:1}
  }
  @keyframes stutter{
    0%,87%,90%,100%{transform:translateX(0)}
    87.5%{transform:translateX(-2px)}
    88%{transform:translateX(2px)}
    88.5%{transform:translateX(-1px)}
    89%{transform:translateX(0)}
  }
  @keyframes afterimage{
    0%,87%,90%,100%{opacity:0;transform:translate(0,0)}
    87.5%{opacity:.25;transform:translate(3px,-1px)}
    88%{opacity:0}
    88.5%{opacity:.28;transform:translate(-3px,1px)}
    89%{opacity:0}
  }
  @media(prefers-color-scheme:dark){
    .ascii{fill:#b4fff4}
    .echo{fill:#ea87ff}
    @keyframes signal{
      0%,3%,14%,100%{fill:#b4fff4;opacity:1}
      5%,7%{fill:#fffdf1;opacity:1}
      9%{fill:#eaa9ff;opacity:1}
      11%{fill:#6ddfff;opacity:1}
    }
  }
  @media(prefers-reduced-motion:reduce){.ink,.row,.echo{animation:none}.echo{opacity:0}}
</style>
