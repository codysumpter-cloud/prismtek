<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 172" role="img" aria-labelledby="title desc">
<title id="title">PRISMTEK</title>
<desc id="desc">PRISMTEK in genuine animated ASCII letters. A luminous wave runs through the characters from left to right with occasional restrained terminal glitches. No other imagery.</desc>
<style>
  .ascii,.echo {font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:30px;font-weight:800;white-space:pre;letter-spacing:0}
  .ascii{fill:#165a72}
  .ink{animation:signal 6.8s steps(1,end) infinite}
  .row{animation:stutter 10.4s steps(1,end) infinite}
  .row-1{animation-delay:-.07s}.row-2{animation-delay:-.15s}.row-3{animation-delay:-.22s}.row-4{animation-delay:-.3s}
  .c0{animation-delay:0.000s}
.c1{animation-delay:0.065s}
.c2{animation-delay:0.130s}
