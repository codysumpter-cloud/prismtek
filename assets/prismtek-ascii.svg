<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="352" viewBox="0 0 1080 352" role="img" aria-labelledby="title desc">
  <title id="title">PRISMTEK — animated ASCII banner</title>
  <desc id="desc">Glowing ASCII letters spell PRISMTEK in a retro terminal with a moving scanline, color shimmer, and blinking cursor. Play, build, share.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e1d"/>
      <stop offset="55%" stop-color="#10132d"/>
      <stop offset="100%" stop-color="#070e21"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ae3d5"/>
      <stop offset="49%" stop-color="#83a8ff">
        <animate attributeName="stop-color" values="#83a8ff;#c08cff;#83a8ff" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#d58aff"/>
    </linearGradient>
    <filter id="glow" x="-12%" y="-25%" width="124%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#b3b4ff" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1080" height="352" fill="url(#background)"/>
  <rect width="1080" height="352" fill="url(#dots)"/>
  <rect x="24" y="18" width="1032" height="318" rx="8" fill="none" stroke="#57739f" stroke-opacity="0.62" stroke-width="1.5"/>
  <path d="M73 71 H1007 M73 294 H1007" fill="none" stroke="#3b5a7d" stroke-width="1" opacity="0.7"/>
  <g fill="#76a7d3" font-family="Consolas, Menlo, 'Liberation Mono', monospace" font-size="13">
    <text x="74" y="55">[ PRISMTEK.EXE ]  //  PUBLIC PROJECTS</text>
    <text x="1005" y="55" text-anchor="end">NODE_01  ::  ONLINE</text>
    <text x="75" y="326">+ PRISMTEK LAB</text>
    <text x="1004" y="326" text-anchor="end">PLAY / BUILD / SHARE +</text>
  </g>
  <g font-family="Consolas, Menlo, 'Liberation Mono', monospace" font-size="25" font-weight="bold" letter-spacing="0" fill="#d98aff" opacity="0.16" transform="translate(2 0)">
    <text x="540" y="107" text-anchor="middle" xml:space="preserve">####   ####   #####   ####  #   #  #####  #####  #   #</text>
    <text x="540" y="135" text-anchor="middle" xml:space="preserve">#   #  #   #    #    #      ## ##    #    #      #  # </text>
    <text x="540" y="163" text-anchor="middle" xml:space="preserve">#   #  #   #    #    #      # # #    #    #      # #  </text>
    <text x="540" y="191" text-anchor="middle" xml:space="preserve">####   ####     #     ###   #   #    #    ####   ##   </text>
    <text x="540" y="219" text-anchor="middle" xml:space="preserve">#      # #      #        #  #   #    #    #      # #  </text>
    <text x="540" y="247" text-anchor="middle" xml:space="preserve">#      #  #     #        #  #   #    #    #      #  # </text>
    <text x="540" y="275" text-anchor="middle" xml:space="preserve">#      #   #  #####  ####   #   #    #    #####  #   #</text>
    <animate attributeName="opacity" values="0.11;0.11;0.45;0.11;0.11" keyTimes="0;0.62;0.64;0.67;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <g font-family="Consolas, Menlo, 'Liberation Mono', monospace" font-size="25" font-weight="bold" letter-spacing="0" fill="url(#neon)" filter="url(#glow)">
    <text x="540" y="107" text-anchor="middle" xml:space="preserve">####   ####   #####   ####  #   #  #####  #####  #   #</text>
    <text x="540" y="135" text-anchor="middle" xml:space="preserve">#   #  #   #    #    #      ## ##    #    #      #  # </text>
    <text x="540" y="163" text-anchor="middle" xml:space="preserve">#   #  #   #    #    #      # # #    #    #      # #  </text>
    <text x="540" y="191" text-anchor="middle" xml:space="preserve">####   ####     #     ###   #   #    #    ####   ##   </text>
    <text x="540" y="219" text-anchor="middle" xml:space="preserve">#      # #      #        #  #   #    #    #      # #  </text>
    <text x="540" y="247" text-anchor="middle" xml:space="preserve">#      #  #     #        #  #   #    #    #      #  # </text>
    <text x="540" y="275" text-anchor="middle" xml:space="preserve">#      #   #  #####  ####   #   #    #    #####  #   #</text>
    <animate attributeName="opacity" values="1;1;0.7;1;1" keyTimes="0;0.62;0.64;0.67;1" dur="9s" repeatCount="indefinite"/>
  </g>
  <rect x="120" y="92" width="840" height="2" fill="#aaf6ff" opacity="0.23">
    <animate attributeName="y" values="91;286;91" dur="6.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.32;0" dur="6.4s" repeatCount="indefinite"/>
  </rect>
  <text x="540" y="315" text-anchor="middle" fill="#e1e7ff" font-family="Consolas, Menlo, 'Liberation Mono', monospace" font-size="15" letter-spacing="2">
    &gt; COMMUNITY-FIRST TOOLS FOR PLAYERS &amp; CREATORS
    <tspan fill="#5af2da">_</tspan>
  </text>
  <rect x="814" y="304" width="7" height="13" fill="#5af2da">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <g fill="#7be6e3" font-family="monospace" font-size="16" opacity="0.7">
    <text x="50" y="178">+</text>
    <text x="1010" y="241">*</text>
    <text x="1016" y="122">.</text>
    <text x="55" y="253">:</text>
  </g>
</svg>
