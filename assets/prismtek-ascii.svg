<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" role="img" aria-labelledby="title desc" style="background:transparent">
<title id="title">Prismtek animated ASCII header</title>
<desc id="desc">ASCII PRISMTEK wordmark above a tiny arcade-prism mascot cycling through standby, play, build and share expressions. All visible artwork is rendered with monospace text characters.</desc>
<style>
  .wordmark,.ascii,.caption{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre;font-weight:700}
  .wordmark{font-size:21px;fill:#184c78}
  .ascii{font-size:17px;fill:#184c78}
  .caption{font-size:15px;fill:#008c9f;letter-spacing:.3px}
  .bob{animation:bob 2.8s ease-in-out infinite}
  .frame{opacity:0;animation-duration:7.2s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  .idle{animation-name:idleFrame;opacity:1}
  .play{animation-name:playFrame}
  .build{animation-name:buildFrame}
  .share{animation-name:shareFrame}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes idleFrame{0%,24.99%{opacity:1}25%,100%{opacity:0}}
  @keyframes playFrame{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}
  @keyframes buildFrame{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}
  @keyframes shareFrame{0%,74.99%{opacity:0}75%,99.99%{opacity:1}100%{opacity:0}}
  @media (prefers-color-scheme:dark){.wordmark,.ascii{fill:#c8f8ee}.caption{fill:#86dfda}}
  @media (prefers-reduced-motion:reduce){.bob,.frame{animation:none}.frame{opacity:0}.idle{opacity:1}}
</style>
<g class="wordmark">
  <text x="84" y="44" xml:space="preserve">
    <tspan x="84"> ____  ____  ___ ____  __  __ _____ _____ _  __</tspan>
    <tspan x="84" dy="25">|  _ \|  _ \|_ _/ ___||  \/  |_   _| ____| |/ /</tspan>
    <tspan x="84" dy="25">| |_) | |_) || |\___ \| |\/| | | | |  _| | ' / </tspan>
    <tspan x="84" dy="25">|  __/|  _ &lt; | | ___) | |  | | | | | |___| . \ </tspan>
    <tspan x="84" dy="25">|_|   |_| \_\___|____/|_|  |_| |_| |_____|_|\_\</tspan>
  </text>
</g>
<text class="caption" x="380" y="182" text-anchor="middle">+ PLAY  /  BUILD  /  SHARE +</text>
<g class="bob">
  <g class="ascii frame idle">
  <text x="150" y="210" xml:space="preserve">
    <tspan x="150">                     /\</tspan>
    <tspan x="150" dy="18">                    /++\</tspan>
    <tspan x="150" dy="18">                   /____\</tspan>
    <tspan x="150" dy="18">           .------/------\------.</tspan>
    <tspan x="150" dy="18">        __/ [::] |  o  o  | (o)  \__</tspan>
    <tspan x="150" dy="18">       /         |   u    |         \</tspan>
    <tspan x="150" dy="18">       \_________+--------+_________/</tspan>
    <tspan x="150" dy="18">                 | [ P ]  |</tspan>
    <tspan x="150" dy="18">                 +--------+</tspan>
    <tspan x="150" dy="18">                  /|    |\</tspan>
    <tspan x="150" dy="18">                 /_|____|_\</tspan>
    <tspan x="150" dy="18">               [ STANDBY ]</tspan>
  </text>
  </g>
  <g class="ascii frame play">
  <text x="150" y="210" xml:space="preserve">
    <tspan x="150">            *        /\         *</tspan>
    <tspan x="150" dy="18">                    /^^\</tspan>
    <tspan x="150" dy="18">                   /____\</tspan>
    <tspan x="150" dy="18">           .------/------\------.</tspan>
    <tspan x="150" dy="18">      \o/__/ [&gt;&gt;] |  ^  ^  | (*)  \__\o/</tspan>
    <tspan x="150" dy="18">       /         |  \_/   |         \</tspan>
    <tspan x="150" dy="18">       \_________+--------+_________/</tspan>
    <tspan x="150" dy="18">                 | [ P ]  |</tspan>
    <tspan x="150" dy="18">                 +--------+</tspan>
    <tspan x="150" dy="18">                  /|    |\</tspan>
    <tspan x="150" dy="18">                 /_|____|_\</tspan>
    <tspan x="150" dy="18">               [ PLAY MODE ]</tspan>
  </text>
  </g>
  <g class="ascii frame build">
  <text x="150" y="210" xml:space="preserve">
    <tspan x="150">              +      /\     +</tspan>
    <tspan x="150" dy="18">                    /##\</tspan>
    <tspan x="150" dy="18">                   /____\</tspan>
    <tspan x="150" dy="18">           .------/------\------.</tspan>
    <tspan x="150" dy="18">        __/ [++] |  -  -  | (.)  \__</tspan>
    <tspan x="150" dy="18">       /         |   _    |         \</tspan>
    <tspan x="150" dy="18">       \_________+--------+_________/</tspan>
    <tspan x="150" dy="18">                 | [ P ]  |</tspan>
    <tspan x="150" dy="18">                 +--------+</tspan>
    <tspan x="150" dy="18">                  /|    |\</tspan>
    <tspan x="150" dy="18">                 /_|____|_\</tspan>
    <tspan x="150" dy="18">               [ BUILDING ]</tspan>
  </text>
  </g>
  <g class="ascii frame share">
  <text x="150" y="210" xml:space="preserve">
    <tspan x="150">          .     *   /\   *     .</tspan>
    <tspan x="150" dy="18">                    /&lt;&gt;\</tspan>
    <tspan x="150" dy="18">                   /____\</tspan>
    <tspan x="150" dy="18">           .------/------\------.</tspan>
    <tspan x="150" dy="18">      \o/__/ [::] |  *  *  | (o)  \__\o/</tspan>
    <tspan x="150" dy="18">       /         |   w    |         \</tspan>
    <tspan x="150" dy="18">       \_________+--------+_________/</tspan>
    <tspan x="150" dy="18">                 | [ P ]  |</tspan>
    <tspan x="150" dy="18">                 +--------+</tspan>
    <tspan x="150" dy="18">                  /|    |\</tspan>
    <tspan x="150" dy="18">                 /_|____|_\</tspan>
    <tspan x="150" dy="18">               [ SHARE IT ]</tspan>
  </text>
  </g>
</g>
<text class="caption" x="380" y="436" text-anchor="middle">// COMMUNITY-FIRST GAME TOOLS //</text>
</svg>
